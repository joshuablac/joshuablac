<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05060f"/><stop offset="0.55" stop-color="#0d0b2a"/><stop offset="1" stop-color="#1b0833"/></linearGradient>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/><animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/></linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset="0.35" stop-color="#67e8f9"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="botglow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <radialGradient id="coreg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2150"/><stop offset="1" stop-color="#140d2e"/></linearGradient>
  <linearGradient id="flameg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#6366f1" stroke-opacity="0.08"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .cursor{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
    .scan{animation:scan 6s linear infinite}@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(320px)}}
    .bot{animation:float 3.2s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.2s ease-in-out infinite}@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.75);opacity:.2}}
    .eye{transform-box:fill-box;transform-origin:center;animation:eyeblink 4s infinite}@keyframes eyeblink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
    .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.6s ease-in-out infinite}@keyframes wave{0%,100%{transform:rotate(15deg)}50%{transform:rotate(45deg)}}
    .botcore{animation:botcore 1.8s ease-in-out infinite}@keyframes botcore{0%,100%{opacity:.55}50%{opacity:1}}
    .bubble{animation:pop 6s ease-in-out infinite}@keyframes pop{0%,82%{opacity:1}88%,94%{opacity:0}100%{opacity:1}}
    .flame{transform-box:fill-box;transform-origin:top;animation:flame .35s ease-in-out infinite alternate}@keyframes flame{from{transform:scaleY(.7)}to{transform:scaleY(1.15)}}
  </style>
</defs>
