<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260">
<defs>
<style>
  .mono{font-family:'JetBrains Mono',Consolas,'Courier New',monospace}
  .bot{animation:float 3.2s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.2s ease-in-out infinite}
  @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.45}50%{transform:scaleX(.75);opacity:.2}}
  .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
  @keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
  .wave{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.6s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:rotate(15deg)}50%{transform:rotate(45deg)}}
  .core{animation:core 1.8s ease-in-out infinite}
  @keyframes core{0%,100%{opacity:.55}50%{opacity:1}}
  .bubble{animation:pop 6s ease-in-out infinite}
  @keyframes pop{0%,82%{opacity:1}88%,94%{opacity:0}100%{opacity:1}}
  .flame{transform-box:fill-box;transform-origin:top;animation:flame .35s ease-in-out infinite alternate}
  @keyframes flame{from{transform:scaleY(.7)}to{transform:scaleY(1.15)}}
</style>
<radialGradient id="glow"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<radialGradient id="coreg"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2150"/><stop offset="1" stop-color="#140d2e"/></linearGradient>
<linearGradient id="flameg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
</defs>

<ellipse cx="130" cy="130" rx="120" ry="120" fill="url(#glow)"/>
<ellipse class="shadow" cx="130" cy="244" rx="46" ry="6" fill="#a78bfa"/>

<g class="bot">
  <!-- antenna + orbiting electron -->
  <line x1="130" y1="52" x2="130" y2="30" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="130" cy="26" r="6" fill="#22d3ee"/>
  <ellipse cx="130" cy="26" rx="26" ry="8" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-width="1.2"/>
  <circle r="3.5" fill="#f472b6">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M156 26 A26 8 0 1 1 104 26 A26 8 0 1 1 156 26"/>
  </circle>

  <!-- head -->
  <rect x="84" y="52" width="92" height="66" rx="20" fill="url(#metal)" stroke="#a78bfa" stroke-width="2.5"/>
  <rect x="96" y="64" width="68" height="40" rx="12" fill="#05060f" stroke="#22d3ee" stroke-opacity=".5"/>
  <rect class="eye" x="110" y="74" width="12" height="18" rx="6" fill="#22d3ee"/>
  <rect class="eye" x="138" y="74" width="12" height="18" rx="6" fill="#22d3ee"/>
  <circle cx="80" cy="85" r="6" fill="#f472b6"/>
  <circle cx="180" cy="85" r="6" fill="#f472b6"/>

  <!-- body -->
  <rect x="122" y="118" width="16" height="8" fill="#a78bfa"/>
  <rect x="92" y="126" width="76" height="70" rx="18" fill="url(#metal)" stroke="#a78bfa" stroke-width="2.5"/>
  <circle class="core" cx="130" cy="152" r="18" fill="url(#coreg)"/>
  <circle cx="130" cy="152" r="10" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="130" y="186" class="mono" font-size="9" fill="#fbbf24" text-anchor="middle" letter-spacing="1">J-0SH v1.0</text>

  <!-- arms -->
  <rect x="72" y="134" width="14" height="44" rx="7" fill="url(#metal)" stroke="#a78bfa" stroke-width="2"/>
  <g class="wave">
    <rect x="174" y="104" width="14" height="40" rx="7" fill="url(#metal)" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="181" cy="100" r="8" fill="#22d3ee"/>
  </g>

  <!-- jet -->
  <rect x="116" y="196" width="28" height="8" rx="3" fill="#a78bfa"/>
  <path class="flame" d="M118 204 L142 204 L130 232 Z" fill="url(#flameg)"/>
</g>

<!-- speech bubble -->
<g class="bubble">
  <rect x="218" y="40" width="190" height="62" rx="14" fill="#0d0b2a" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M222 80 L204 92 L230 88 Z" fill="#0d0b2a" stroke="#22d3ee" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="223" y="79" width="12" height="9" fill="#0d0b2a"/>
  <text x="234" y="66" class="mono" font-size="13" fill="#e2e8f0">hi, I'm J-0SH ⚛</text>
  <text x="234" y="87" class="mono" font-size="12" fill="#f472b6">let's build something!</text>
</g>
</svg>
